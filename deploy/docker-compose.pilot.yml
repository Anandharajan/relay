# Relay Voice pilot on one GPU PC: see docs/VOICE_PILOT.md. Nothing publishes a port to the network;
# outside traffic arrives only through the Cloudflare tunnel. FreeToken runs on the host.
name: fin-voice-pilot
services:
  app:
    image: fin-voice:pilot
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RELAY_SECRET: ${RELAY_SECRET:?Set RELAY_SECRET in .env.pilot}
      DATABASE_URL: postgres://voice:${VOICE_DB_PASSWORD:?Set VOICE_DB_PASSWORD in .env.pilot}@postgres:5432/voice
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to the tunnel HTTPS address}
      RELAY_PRODUCT: voice
      DEMO_SEED: "false"
      SIGNUP_INVITE_CODE: ${SIGNUP_INVITE_CODE:?Set SIGNUP_INVITE_CODE so the public link is invite-only}
      LLM_PROVIDER: freetoken
      LLM_BASE_URL: http://host.docker.internal:1919/v1
      LLM_MODEL: ${FREETOKEN_MODEL:?Set FREETOKEN_MODEL to the served model name}
      LLM_API_KEY: ${FREETOKEN_API_KEY:?Set FREETOKEN_API_KEY}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-120000}
      # One GPU: a second run waits in the queue rather than slowing the first.
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-2}
      VOICESTUDIO_URL: http://voicestudio:3900
      VOICESTUDIO_API_KEY: ${OMNIVOICE_API_KEY:?Set OMNIVOICE_API_KEY}
      SPEECH_ALLOW_PRIVATE_HOSTS: "true"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: ${VOICE_DB_PASSWORD:?Set VOICE_DB_PASSWORD in .env.pilot}
      POSTGRES_DB: voice
    volumes:
      - pilot-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voice"]
      interval: 5s
      timeout: 5s
      retries: 20
  voicestudio:
    image: ghcr.io/debpalash/voicestudio:stable
    restart: unless-stopped
    gpus: all
    # The admin screen is for licence acceptance and model downloads, on this PC only.
    ports:
      - "127.0.0.1:3900:3900"
    environment:
      OMNIVOICE_API_KEY: ${OMNIVOICE_API_KEY:?Set OMNIVOICE_API_KEY}
      OMNIVOICE_ANALYTICS_DISABLED: "1"
    volumes:
      - pilot-voicestudio:/app/omnivoice_data
  tunnel:
    image: cloudflare/cloudflared:2025.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run --url http://app:8787
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
volumes:
  pilot-postgres:
  pilot-voicestudio:
