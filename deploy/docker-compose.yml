# Self-host Relay with fully open-source infrastructure.
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml --profile ollama up -d      # + local open-weight LLM
#   docker compose -f deploy/docker-compose.yml --profile minio up -d       # + S3-compatible storage
name: relay

services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      RELAY_SECRET: ${RELAY_SECRET:?Set RELAY_SECRET in .env (a long random string)}
    volumes:
      - relay-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17   # PostgreSQL + pgvector (both open source)
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      retries: 20

  # Local LLM + embeddings. After start: docker compose exec ollama ollama pull qwen2.5:7b
  # Then in the dashboard choose "Ollama" with base URL http://ollama:11434/v1
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

  # S3-compatible object storage. Set S3_ENDPOINT=http://minio:9000 and keys in .env, create bucket "relay".
  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-relay}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-relay-minio-secret}
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  relay-data:
  pg-data:
  ollama-data:
  minio-data:
