name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add an FAQ source with …
        2. Ask the widget "…" in Hindi
        3. …
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: How are you running Relay?
      options: [Relay Cloud, Docker Compose, "pnpm start (local)", Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: dropdown
    id: model
    attributes:
      label: Answer model
      options: [Extractive (no LLM), Anthropic, OpenAI, Gemini, Ollama / local, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server logs or browser console output. Remove API keys and customer data first.
      render: shell
