name: Feature request
description: Suggest an idea or a missing integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Tell us about your business and your customers (channel, language, volume).
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Relay to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
